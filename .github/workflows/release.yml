name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Cloudflare Pages deploys production from main through its git integration,
# so this workflow only checks and releases the package.
jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
      issues: write # to comment on released issues
      pull-requests: write # to comment on released pull requests
      id-token: write # npm trusted publishing (OIDC), which also adds provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:pkg

      - name: Check package contents
        run: npm pack --dry-run 2>&1 | grep -q "template/gitignore"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release