version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - chore
    commit-message:
      prefix: chore
      include: scope
    # Minor and patch updates come in one PR. Majors come one by one, since
    # they are the ones that break things.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The project create-kami copies, with its own lockfile. It ships inside the
  # npm package, so updates use `fix` to trigger a patch release.
  - package-ecosystem: npm
    directory: /template
    schedule:
      interval: weekly
      day: monday
    labels:
      - chore
    commit-message:
      prefix: fix
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - chore
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - '*'
